[project]
name = "dossier-backend"
version = "0.0.1"
description = "Dossier — cited-OSINT AI investigation agent for seed-stage VC first-meeting prep."
requires-python = ">=3.12"
readme = "../README.md"
dependencies = [
    # web framework (deferred to Phase 2; pinned now for consistency)
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "mangum>=0.19.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.1",
    "fastapi-clerk-auth>=0.0.7",
    "python-jose>=3.5.0",
    # data / validation
    "pydantic>=2.11.10",
    "psycopg[binary,pool]>=3.2.3",
    "pgvector>=0.3.6",
    "sqlalchemy>=2.0.44",
    "alembic>=1.14.0",
    # agent framework (deferred to Phase 2/3; pinned now)
    "langgraph>=1.0.2",
    "langgraph-checkpoint>=3.0.1",
    "langgraph-checkpoint-postgres>=3.0.5",
    "langgraph-prebuilt>=1.0.2",
    "langchain-core>=1.0.4",
    "langchain-openai>=1.0.2",
    "langchain-text-splitters>=0.3.0",
    # LLM + embeddings
    "openai>=2.7.1",
    "tiktoken>=0.8.0",
    "tenacity>=9.1.2",
    "httpx>=0.28.1",
    # web search + crawl (Phase 2+)
    "exa-py>=1.0.0",
    "firecrawl-py>=1.0.0",
    # PDF + vision (Phase 5)
    "pypdf>=6.1.1",
    "pdf2image>=1.17.0",
    "Pillow>=11.0.0",
    # observability — Phase 1 smoke test uses langfuse directly
    "langfuse>=3.3.4",
    "logfire>=4.7.0",
    # AWS (Phase 3+)
    "boto3>=1.40.0",
    "markitdown[pdf]>=0.1.5",
    "langchain>=1.2.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-recording>=0.13",
    "ragas>=0.3.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
# Phase 2 adds tests/integration/ per STACK.md §2.11 + CONTEXT.md D-15 logical module split.
# tests/eval/ remains scaffolded-but-excluded; Phase 4 wires it in (CONTEXT §deferred).
markers = [
    "integration: real DB + mocked HTTP (respx); slower than unit",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
